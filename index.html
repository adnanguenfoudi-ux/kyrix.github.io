<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYRIX - Tienda Moderna</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --dark: #0f172a;
            --light: #ffffff;
            --gray: #f1f5f9;
            --text: #334155;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray);
            color: var(--text);
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: var(--dark);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 10px var(--shadow);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--light);
            transition: color 0.3s ease;
        }

        .cart-icon:hover { color: var(--primary); }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--primary);
            color: var(--light);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, var(--dark) 0%, var(--secondary) 100%);
            color: var(--light);
            padding: 120px 2rem 80px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .btn {
            background: var(--primary);
            color: var(--light);
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Products */
        .products {
            padding: 5rem 0;
            background: var(--light);
        }

        .products h2 {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 3rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .product {
            background: var(--light);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px var(--shadow);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(30px);
        }

        .product.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .product:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px var(--shadow);
        }

        .product-image {
            height: 200px;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .product-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.1), transparent);
            transition: left 0.5s;
        }

        .product:hover .product-image::before { left: 100%; }

        .product-content { padding: 1.5rem; }

        .product-category {
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .product h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
        }

        .product p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            height: 2.4rem;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .product .btn {
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }

        /* Cart */
        .cart {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--dark);
            color: var(--light);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-width: 300px;
            max-width: 400px;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .cart.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .cart-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .cart-close {
            cursor: pointer;
            font-size: 1.5rem;
            color: #64748b;
            transition: color 0.3s ease;
        }

        .cart-close:hover { color: var(--primary); }

        .cart-items {
            max-height: 300px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #334155;
        }

        .cart-item:last-child { border-bottom: none; }

        .cart-item h4 {
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
        }

        .cart-item-price {
            color: var(--primary);
            font-weight: 600;
        }

        .cart-total {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid #334155;
            text-align: center;
        }

        .cart-total h3 {
            color: var(--primary);
            font-size: 1.2rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .products-grid { grid-template-columns: 1fr; }
            .cart {
                left: 20px;
                right: 20px;
                bottom: 20px;
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <div class="logo">KYRIX</div>
            <div class="cart-icon" onclick="toggleCart()">🛒<span class="cart-count" id="cart-count">0</span></div>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="container">
            <h1>KYRIX</h1>
            <p>Descubre productos premium con diseño moderno y tecnología avanzada</p>
            <button class="btn" onclick="scrollToProducts()">Ver Productos</button>
        </div>
    </section>

    <!-- Products -->
    <section class="products" id="products">
        <div class="container">
            <h2>Productos Destacados</h2>
            <div class="products-grid" id="products-grid">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Cart -->
    <div class="cart" id="cart">
        <div class="cart-header">
            <h3 class="cart-title">Carrito de Compras</h3>
            <span class="cart-close" onclick="toggleCart()">×</span>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-total" id="cart-total"><h3>Total: 0€</h3></div>
    </div>

    <script>
        // Data
        const products = [
            { id: 1, name: 'Smartphone Pro', price: 899, category: 'Tecnología', emoji: '📱', desc: 'Cámara avanzada, batería de larga duración' },
            { id: 2, name: 'Smartwatch Elite', price: 349, category: 'Tecnología', emoji: '⌚', desc: 'Monitoreo de salud, GPS integrado' },
            { id: 3, name: 'Auriculares Premium', price: 199, category: 'Tecnología', emoji: '🎧', desc: 'Cancelación de ruido, sonido Hi-Fi' },
            { id: 4, name: 'Robot Aspirador', price: 399, category: 'Hogar', emoji: '🏠', desc: 'Navegación inteligente, control por app' },
            { id: 5, name: 'Bombillas Inteligentes', price: 49, category: 'Hogar', emoji: '💡', desc: 'Control por voz, 16 millones de colores' },
            { id: 6, name: 'Cafetera Automática', price: 299, category: 'Hogar', emoji: '🍳', desc: 'Molienda integrada, espuma perfecta' },
            { id: 7, name: 'Traje Ejecutivo', price: 599, category: 'Moda', emoji: '👔', desc: 'Lana italiana premium, corte perfecto' },
            { id: 8, name: 'Zapatos Deportivos', price: 149, category: 'Moda', emoji: '👟', desc: 'Amortiguación avanzada, transpirables' },
            { id: 9, name: 'Bolso de Cuero', price: 249, category: 'Moda', emoji: '👜', desc: 'Cuero genuino, múltiples compartimentos' }
        ];

        let cart = [];
        let cartCount = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            setupScrollObserver();
            setupAutoCartFill();
        });

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = products.map(product => `
                <div class="product" data-category="${product.category.toLowerCase()}">
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-content">
                        <div class="product-category">${product.category}</div>
                        <h3>${product.name}</h3>
                        <p>${product.desc}</p>
                        <div class="product-footer">
                            <span class="price">${product.price}€</span>
                            <button class="btn" onclick="addToCart(${product.id})">Agregar</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                cartCount++;
                updateCartUI();
                showCartBriefly();
            }
        }

        function updateCartUI() {
            document.getElementById('cart-count').textContent = cartCount;

            const cartItems = document.getElementById('cart-items');
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            cartItems.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <h4>${item.name}</h4>
                    </div>
                    <span class="cart-item-price">${item.price}€</span>
                </div>
            `).join('');

            document.getElementById('cart-total').innerHTML = `<h3>Total: ${total}€</h3>`;
        }

        function toggleCart() {
            document.getElementById('cart').classList.toggle('visible');
        }

        function showCartBriefly() {
            const cartEl = document.getElementById('cart');
            cartEl.classList.add('visible');
            setTimeout(() => cartEl.classList.remove('visible'), 2000);
        }

        function scrollToProducts() {
            document.getElementById('products').scrollIntoView({ behavior: 'smooth' });
        }

        function setupScrollObserver() {
            const observer = new IntersectionObserver(
                entries => entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                }),
                { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
            );

            document.querySelectorAll('.product').forEach(product => observer.observe(product));
        }

        function setupAutoCartFill() {
            let lastScrollPercent = 0;
            window.addEventListener('scroll', () => {
                const scrollTop = window.pageYOffset;
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const scrollPercent = Math.floor((scrollTop / docHeight) * 100);

                if (scrollPercent > lastScrollPercent && scrollPercent % 15 === 0 && cart.length < 3) {
                    const availableProducts = products.filter(p => !cart.find(c => c.id === p.id));
                    if (availableProducts.length > 0) {
                        const randomProduct = availableProducts[Math.floor(Math.random() * availableProducts.length)];
                        addToCart(randomProduct.id);
                    }
                }
                lastScrollPercent = scrollPercent;
            });
        }
    </script>
</body>
</html>

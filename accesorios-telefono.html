<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesorios Teléfono - KAYLEX SHOP</title>
    <meta name="description" content="Accesorios de teléfono de alta calidad y durabilidad.">
    <meta name="keywords" content="accesorios teléfono, funda, protector">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-000000-2"></script>
    <script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'UA-000000-2');</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%); color: #ffffff; overflow-x: hidden; min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; }
        .glass-strong { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; }
        nav { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 30px; }
        nav .glass { padding: 15px 30px; display: flex; align-items: center; gap: 30px; }
        nav a { color: #ffffff; text-decoration: none; font-weight: 500; transition: all 0.3s ease; }
        nav a:hover { color: #00d4ff; text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
        .cart-icon { position: relative; cursor: pointer; font-size: 1.2em; transition: all 0.3s ease; }
        .cart-icon:hover { transform: scale(1.1); color: #00d4ff; }
        .cart-count { position: absolute; top: -8px; right: -10px; background: #ff4444; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .category-header { padding: 100px 20px 50px; text-align: center; }
        .category-header h1 { font-size: 3em; margin-bottom: 15px; background: linear-gradient(45deg, #ffffff, #00d4ff); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .category-header p { font-size: 1.1em; opacity: 0.8; max-width: 600px; margin: 0 auto; }
        .back-btn { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; background: rgba(0, 212, 255, 0.15); border: 1px solid rgba(0, 212, 255, 0.4); border-radius: 25px; color: #00d4ff; cursor: pointer; margin-top: 30px; font-weight: 500; text-decoration: none; transition: all 0.3s ease; }
        .back-btn:hover { background: rgba(0, 212, 255, 0.3); transform: translateX(-5px); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 50px 20px; }
        .product-card { padding: 20px; text-align: center; opacity: 0; animation: slideInUp 0.6s ease forwards; }
        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.2s; }
        .product-card:nth-child(3) { animation-delay: 0.3s; }
        .product-card:nth-child(4) { animation-delay: 0.4s; }
        .product-card:nth-child(5) { animation-delay: 0.5s; }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2); }
        .product-image { width: 150px; height: 150px; margin: 0 auto 20px; background: rgba(255, 255, 255, 0.1); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 3em; color: #00d4ff; }
        .product-title { font-size: 1.3em; margin-bottom: 10px; }
        .product-rating { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .stars { color: #ffd700; letter-spacing: 3px; }
        .rating-text { color: #00d4ff; font-weight: bold; }
        .product-price { font-size: 1.5em; color: #00d4ff; margin-bottom: 20px; font-weight: bold; }
        .add-to-cart { padding: 10px 20px; background: rgba(0, 212, 255, 0.2); border: 1px solid rgba(0, 212, 255, 0.5); border-radius: 25px; color: #ffffff; cursor: pointer; font-weight: 500; transition: all 0.3s ease; }
        .add-to-cart:hover { background: rgba(0, 212, 255, 0.4); box-shadow: 0 0 20px rgba(0, 212, 255, 0.5); }
        .cart { position: fixed; top: 0; right: -400px; width: 400px; height: 100vh; z-index: 1001; transition: right 0.5s ease; overflow-y: auto; }
        .cart.open { right: 0; }
        .cart .glass-strong { height: 100%; display: flex; flex-direction: column; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .cart-title { font-size: 1.5em; color: #00d4ff; }
        .close-cart { cursor: pointer; font-size: 1.5em; color: #00d4ff; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; gap: 15px; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; margin-bottom: 15px; align-items: center; }
        .cart-item-image { width: 80px; height: 80px; background: rgba(0, 212, 255, 0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #00d4ff; font-size: 2em; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-weight: bold; margin-bottom: 5px; }
        .cart-item-price { color: #00d4ff; font-weight: bold; }
        .quantity-selector { display: flex; align-items: center; gap: 10px; }
        .quantity-btn { width: 30px; height: 30px; background: rgba(0, 212, 255, 0.2); border: 1px solid rgba(0, 212, 255, 0.4); border-radius: 50%; color: #00d4ff; cursor: pointer; font-weight: bold; }
        .quantity { min-width: 30px; text-align: center; }
        .cart-total { padding: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 212, 255, 0.1); }
        .total-price { font-size: 1.3em; font-weight: bold; color: #00d4ff; }
        @media (max-width: 768px) { .category-header h1 { font-size: 2em; } .products-grid { grid-template-columns: 1fr; } .cart { width: 100%; right: -100%; } }
        @media (max-width: 480px) { nav a { display: none; } nav a:first-child { display: inline; } .category-header { padding: 80px 15px 30px; } .category-header h1 { font-size: 1.5em; } }
    </style>
    <script src="https://www.paypal.com/sdk/js?client-id=ARQy3k69iOFXS0oSHfo315y2yo7tvgyMU6snRZtU6Lv83rRmNCSkPH08J4KLR96PCx9fHaKxQNTis1sp&currency=USD"></script>
</head>
<body>
    <nav>
        <div class="glass">
            <a href="index.html">Inicio</a>
            <a href="accessories.html">← Atrás</a>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </nav>

    <section class="category-header">
        <a href="accessories.html" class="back-btn"><i class="fas fa-arrow-left"></i> Volver a Accesorios</a>
        <h1>📱 Accesorios Teléfono</h1>
        <p>Fundas, protectores y accesorios premium para teléfono móvil.</p>
    </section>

    <div class="container"><div class="products-grid" id="productsGrid"></div></div>

    <div class="cart" id="cart">
        <div class="glass-strong">
            <div class="cart-header">
                <h3 class="cart-title">Carrito</h3>
                <div class="close-cart" onclick="toggleCart()"><i class="fas fa-times"></i></div>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total"><div class="total-row"><p class="total-price">Total: $<span id="totalPrice">0.00</span></p><div id="paypal-button-container"></div></div></div>
        </div>
    </div>

    <script>
        let cart = [], cartCount = 0, totalPrice = 0;
        function loadCartFromStorage() { const s = localStorage.getItem('kaylexCart'); if (s) { try { cart = JSON.parse(s); updateCart(); } catch (e) {} } }
        function saveCartToStorage() { try { localStorage.setItem('kaylexCart', JSON.stringify(cart)); } catch (e) {} }
        function toggleCart() { document.getElementById('cart').classList.toggle('open'); }
        function addToCart(n, p) { const e = cart.find(i => i.name === n); if (e) e.quantity++; else cart.push({ name: n, price: p, quantity: 1 }); updateCart(); saveCartToStorage(); document.getElementById('cart').classList.add('open'); }
        function updateCart() { const c = document.getElementById('cartItems'), cnt = document.getElementById('cartCount'), tp = document.getElementById('totalPrice'); c.innerHTML = ''; cartCount = 0; totalPrice = 0; cart.forEach((i, x) => { cartCount += i.quantity; totalPrice += i.price * i.quantity; const el = document.createElement('div'); el.className = 'cart-item'; el.innerHTML = `<div class="cart-item-image"><i class="fas fa-shopping-bag"></i></div><div class="cart-item-info"><p class="cart-item-title">${i.name}</p><p class="cart-item-price">$${i.price.toFixed(2)}</p></div><div class="quantity-selector"><button class="quantity-btn" onclick="changeQuantity(${x}, -1)">-</button><span class="quantity">${i.quantity}</span><button class="quantity-btn" onclick="changeQuantity(${x}, 1)">+</button></div>`; c.appendChild(el); }); cnt.textContent = cartCount; tp.textContent = totalPrice.toFixed(2); }
        function changeQuantity(x, c) { cart[x].quantity += c; if (cart[x].quantity <= 0) cart.splice(x, 1); updateCart(); saveCartToStorage(); }
        function initPayPalButtons() { if (typeof paypal !== 'undefined') { const con = document.getElementById('paypal-button-container'); con.innerHTML = ''; if (cart.length === 0) { con.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">Carrito vacío</p>'; return; } paypal.Buttons({ createOrder: (d, a) => { const items = cart.map(i => ({ name: i.name, unit_amount: { currency_code: "USD", value: i.price.toFixed(2) }, quantity: i.quantity.toString() })); return a.order.create({ intent: "CAPTURE", purchase_units: [{ amount: { currency_code: "USD", value: totalPrice.toFixed(2), breakdown: { item_total: { currency_code: "USD", value: totalPrice.toFixed(2) } } }, items }] }); }, onApprove: (d, a) => a.order.capture().then(det => { cart = []; updateCart(); saveCartToStorage(); setTimeout(() => document.getElementById('cart').classList.remove('open'), 1500); }), onError: e => {} }).render('#paypal-button-container'); } }
        updateCart = (function(orig) { return function() { orig.call(this); initPayPalButtons(); }; })(updateCart);
        loadCartFromStorage();
        document.addEventListener('DOMContentLoaded', () => initPayPalButtons());
        const products = [
            { id: 401, name: 'Funda Premium', price: 29.99, rating: 4.7, image: '<i class="fas fa-mobile-alt"></i>' },
            { id: 402, name: 'Protector de Pantalla', price: 15.99, rating: 4.6, image: '<i class="fas fa-shield-alt"></i>' },
            { id: 403, name: 'Cable USB-C', price: 24.99, rating: 4.8, image: '<i class="fas fa-plug"></i>' },
            { id: 404, name: 'Cargador Rápido', price: 44.99, rating: 4.9, image: '<i class="fas fa-plug"></i>' },
            { id: 405, name: 'Soporte Teléfono', price: 19.99, rating: 4.7, image: '<i class="fas fa-mobile-alt"></i>' }
        ];
        function renderProducts(prods) { const g = document.getElementById('productsGrid'); g.innerHTML = ''; prods.forEach(p => { const c = document.createElement('div'); c.className = 'product-card glass'; c.innerHTML = `<div class="product-image">${p.image}</div><h3 class="product-title">${p.name}</h3><div class="product-rating"><div class="stars">${Array(5).fill('<i class="fas fa-star"></i>').join('')}</div><span class="rating-text">${p.rating}</span></div><p class="product-price">$${p.price}</p><button class="add-to-cart" onclick="addToCart('${p.name}', ${p.price})">Agregar al Carrito</button>`; g.appendChild(c); }); }
        document.addEventListener('DOMContentLoaded', () => renderProducts(products));
    </script>
</body>
</html>

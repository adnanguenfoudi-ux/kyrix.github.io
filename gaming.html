<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Gear - KYRIX STORE</title>
    <meta name="description" content="Level up your gaming with our high-performance gaming peripherals and accessories.">
    <meta name="keywords" content="gaming, mouse, keyboard, controller, headset">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-000000-2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'UA-000000-2');
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav .glass {
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s ease;
        }

        .cart-icon:hover {
            transform: scale(1.1);
            color: #00d4ff;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: #ff4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .category-header {
            padding: 100px 20px 50px;
            text-align: center;
        }

        .category-header h1 {
            font-size: 3em;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ffffff, #00d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .category-header p {
            font-size: 1.1em;
            opacity: 0.8;
            max-width: 600px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 25px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            font-weight: 500;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            transform: translateX(-5px);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 50px 20px;
        }

        .product-card {
            padding: 20px;
            text-align: center;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            opacity: 0;
            animation: slideInUp 0.6s ease forwards;
        }

        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.2s; }
        .product-card:nth-child(3) { animation-delay: 0.3s; }
        .product-card:nth-child(4) { animation-delay: 0.4s; }
        .product-card:nth-child(5) { animation-delay: 0.5s; }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
        }

        .product-image {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: #00d4ff;
        }

        .product-title {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .product-rating {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .stars {
            color: #ffd700;
            letter-spacing: 3px;
        }

        .rating-text {
            color: #00d4ff;
            font-weight: bold;
        }

        .product-price {
            font-size: 1.5em;
            color: #00d4ff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .add-to-cart {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 25px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .add-to-cart:hover {
            background: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        /* Subcategories Section */
        .subcategories-section {
            padding: 50px 20px;
            text-align: center;
        }

        .subcategories-title {
            font-size: 2em;
            margin-bottom: 40px;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .subcategories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 0 20px;
            margin-bottom: 50px;
        }

        .subcategory-card {
            position: relative;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            text-decoration: none;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .subcategory-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .subcategory-card:hover {
            transform: translateY(-10px);
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
        }

        .subcategory-card:hover::before {
            left: 100%;
        }

        .subcategory-icon {
            font-size: 4em;
            margin-bottom: 15px;
            display: block;
        }

        .subcategory-name {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .subcategory-products {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 15px;
        }

        .cart {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            z-index: 1001;
            transition: right 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow-y: auto;
        }

        .cart.open {
            right: 0;
        }

        .cart .glass-strong {
            height: 100%;
            border-radius: 0;
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cart-title {
            font-size: 1.5em;
            color: #00d4ff;
        }

        .close-cart {
            cursor: pointer;
            font-size: 1.5em;
            color: #00d4ff;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            background: rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00d4ff;
            font-size: 2em;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #00d4ff;
            font-weight: bold;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.4);
            border-radius: 50%;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .quantity-btn:hover {
            background: rgba(0, 212, 255, 0.4);
        }

        .quantity {
            min-width: 30px;
            text-align: center;
        }

        .cart-total {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 212, 255, 0.1);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .total-price {
            font-size: 1.3em;
            font-weight: bold;
            color: #00d4ff;
        }

        #paypal-button-container {
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            nav a {
                font-size: 0.9em;
            }

            .category-header h1 {
                font-size: 2em;
            }

            .products-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .cart {
                width: 100%;
                right: -100%;
            }
        }

        @media (max-width: 480px) {
            nav .glass {
                gap: 10px;
                padding: 10px 15px;
            }

            nav a {
                display: none;
            }

            nav a:first-child {
                display: inline;
            }

            .category-header {
                padding: 80px 15px 30px;
            }

            .category-header h1 {
                font-size: 1.5em;
            }
        }
    </style>

    <script src="https://www.paypal.com/sdk/js?client-id=ARQy3k69iOFXS0oSHfo315y2yo7tvgyMU6snRZtU6Lv83rRmNCSkPH08J4KLR96PCx9fHaKxQNTis1sp&currency=USD"></script>
</head>
<body>
    <nav>
        <div class="glass">
            <a href="index.html">Home</a>
            <a href="index.html#categories">All Categories</a>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </div>
    </nav>

    <section class="category-header">
        <a href="index.html#categories" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Categories
        </a>
        <h1>🎮 Gaming Gear</h1>
        <p>Level up your gaming with our high-performance gaming peripherals and accessories.</p>
    </section>

    <!-- Subcategories Section -->
    <div class="subcategories-section">
        <h2 class="subcategories-title">Shop by Subcategory</h2>
        <div class="subcategories-grid">
            <a href="ratones-gaming.html" class="subcategory-card">
                <span class="subcategory-icon">🖱️</span>
                <div class="subcategory-name">Gaming Mice</div>
                <div class="subcategory-products">Precision & Performance</div>
            </a>
            <a href="teclados-gaming.html" class="subcategory-card">
                <span class="subcategory-icon">⌨️</span>
                <div class="subcategory-name">Gaming Keyboards</div>
                <div class="subcategory-products">Mechanical & Wireless</div>
            </a>
        </div>
    </div>

    <div class="container">
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="cart" id="cart">
        <div class="glass-strong">
            <div class="cart-header">
                <h3 class="cart-title">Shopping Cart</h3>
                <div class="close-cart" onclick="toggleCart()">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total">
                <div class="total-row">
                    <p class="total-price">Total: $<span id="totalPrice">0.00</span></p>
                    <div id="paypal-button-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let cartCount = 0;
        let totalPrice = 0;

        function loadCartFromStorage() {
            const savedCart = localStorage.getItem('kyrixCart');
            if (savedCart) {
                try {
                    cart = JSON.parse(savedCart);
                    updateCart();
                } catch (e) {
                    console.error('Error al cargar carrito:', e);
                    cart = [];
                }
            }
        }

        function saveCartToStorage() {
            try {
                localStorage.setItem('kyrixCart', JSON.stringify(cart));
            } catch (e) {
                console.error('Error al guardar carrito:', e);
            }
        }

        function toggleCart() {
            const cartElement = document.getElementById('cart');
            cartElement.classList.toggle('open');
        }

        function addToCart(productName, price) {
            const existingItem = cart.find(item => item.name === productName);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ name: productName, price: price, quantity: 1 });
            }
            updateCart();
            saveCartToStorage();
            showNotification(`${productName} agregado al carrito`);
            
            const cartElement = document.getElementById('cart');
            if (!cartElement.classList.contains('open')) {
                cartElement.classList.add('open');
            }
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: rgba(0, 212, 255, 0.9);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                z-index: 2000;
                animation: slideInNotification 0.4s ease forwards;
                backdrop-filter: blur(10px);
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOutNotification 0.4s ease forwards';
                setTimeout(() => notification.remove(), 400);
            }, 2000);
        }

        function updateCart() {
            const cartItemsElement = document.getElementById('cartItems');
            const cartCountElement = document.getElementById('cartCount');
            const totalPriceElement = document.getElementById('totalPrice');

            cartItemsElement.innerHTML = '';
            cartCount = 0;
            totalPrice = 0;

            cart.forEach((item, index) => {
                cartCount += item.quantity;
                totalPrice += item.price * item.quantity;

                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                itemElement.innerHTML = `
                    <div class="cart-item-image">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <div class="cart-item-info">
                        <p class="cart-item-title">${item.name}</p>
                        <p class="cart-item-price">$${item.price.toFixed(2)}</p>
                    </div>
                    <div class="quantity-selector">
                        <button class="quantity-btn" onclick="changeQuantity(${index}, -1)">-</button>
                        <span class="quantity">${item.quantity}</span>
                        <button class="quantity-btn" onclick="changeQuantity(${index}, 1)">+</button>
                    </div>
                `;
                cartItemsElement.appendChild(itemElement);
            });

            cartCountElement.textContent = cartCount;
            totalPriceElement.textContent = totalPrice.toFixed(2);
        }

        function changeQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCart();
            saveCartToStorage();
        }

        function initPayPalButtons() {
            if (typeof paypal !== 'undefined') {
                const container = document.getElementById('paypal-button-container');
                container.innerHTML = '';
                
                if (cart.length === 0) {
                    container.innerHTML = '<p style="color: #888; text-align: center; padding: 20px;">El carrito está vacío</p>';
                    return;
                }

                paypal.Buttons({
                    createOrder: (data, actions) => {
                        const items = cart.map(item => ({
                            name: item.name,
                            unit_amount: {
                                currency_code: "USD",
                                value: item.price.toFixed(2)
                            },
                            quantity: item.quantity.toString()
                        }));

                        return actions.order.create({
                            intent: "CAPTURE",
                            purchase_units: [{
                                amount: {
                                    currency_code: "USD",
                                    value: totalPrice.toFixed(2),
                                    breakdown: {
                                        item_total: {
                                            currency_code: "USD",
                                            value: totalPrice.toFixed(2)
                                        }
                                    }
                                },
                                items: items
                            }]
                        });
                    },
                    onApprove: (data, actions) => {
                        return actions.order.capture().then((details) => {
                            showNotification(`¡Pago exitoso! Pedido: ${details.id}`);
                            cart = [];
                            updateCart();
                            saveCartToStorage();
                            setTimeout(() => {
                                document.getElementById('cart').classList.remove('open');
                            }, 1500);
                        });
                    },
                    onError: (err) => {
                        showNotification('Error en el pago. Intenta nuevamente.');
                        console.error('Error en PayPal:', err);
                    }
                }).render('#paypal-button-container');
            }
        }

        const originalUpdateCart = updateCart;
        updateCart = function() {
            originalUpdateCart.call(this);
            initPayPalButtons();
        };

        loadCartFromStorage();

        document.addEventListener('DOMContentLoaded', () => {
            initPayPalButtons();
        });

        const products = [
            { id: 2, name: 'Gaming Mouse', price: 79.99, category: 'gaming', rating: 4.7, image: '<i class="fas fa-mouse"></i>' },
            { id: 7, name: 'Mechanical Keyboard', price: 149.99, category: 'gaming', rating: 4.8, image: '<i class="fas fa-keyboard"></i>' },
            { id: 8, name: 'Gaming Controller', price: 79.99, category: 'gaming', rating: 4.6, image: '<i class="fas fa-gamepad"></i>' },
            { id: 14, name: 'Gaming Headset', price: 159.99, category: 'gaming', rating: 4.7, image: '<i class="fas fa-headphones"></i>' }
        ];

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card glass';
                card.innerHTML = `
                    <div class="product-image">${product.image}</div>
                    <h3 class="product-title">${product.name}</h3>
                    <div class="product-rating">
                        <div class="stars">
                            ${Array(5).fill('<i class="fas fa-star"></i>').join('')}
                        </div>
                        <span class="rating-text">${product.rating}</span>
                    </div>
                    <p class="product-price">$${product.price}</p>
                    <button class="add-to-cart" onclick="addToCart('${product.name}', ${product.price})">Add to Cart</button>
                `;
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(products);
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInNotification {
                from {
                    opacity: 0;
                    transform: translateX(400px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }
            @keyframes slideOutNotification {
                to {
                    opacity: 0;
                    transform: translateX(400px);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
